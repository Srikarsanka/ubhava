<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <title>Product Details - UDBHAVA</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="shop.css">
      <link rel=icon href="https://res.cloudinary.com/dnevq4wek/image/upload/v1744636831/logo_qjwdbn.png">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
      <!-- Using same CSS as shop for consistent header/footer -->
</head>

<body>

      <!-- Navbar -->
      <nav class="navbar">
            <div class="logo">
                  <a href="index.html">
                        <h1>UDBHAVA</h1>
                  </a>
            </div>
            <div class="nav-links">
                  <a href="index.html">Home</a>
                  <a href="shop.html">Shop</a>
                  <a href="heritage.html">Heritage</a>
                  <a href="contact.html">Contact</a>
                  <a href="cart.html">Cart</a>
            </div>
      </nav>

      <!-- Product Details Section -->
      <div class="product-details-container"
            style="max-width: 1200px; margin: 150px auto 50px; padding: 20px; display: flex; flex-wrap: wrap; gap: 50px;">

            <!-- Left: Image -->
            <div class="product-image" style="flex: 1; min-width: 300px;">
                  <img id="p-img" src="" alt="Product Image"
                        style="width: 100%; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
            </div>

            <!-- Right: Info -->
            <div class="product-info" style="flex: 1; min-width: 300px;">
                  <h5 id="p-category"
                        style="color: #666; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Category
                  </h5>
                  <h1 id="p-name" style="font-size: 2.5rem; margin: 10px 0; color: #0f346c;">Product Name</h1>
                  <h2 id="p-price" style="color: #ff7b00; font-size: 2rem; margin-bottom: 20px;">₹0</h2>

                  <div style="margin-bottom: 20px;">
                        <p id="p-desc" style="line-height: 1.6; color: #444;">Loading description...</p>
                  </div>

                  <!-- Stock Status -->
                  <p id="p-stock" style="margin-bottom: 20px; font-weight: bold;"></p>

                  <!-- Actions -->
                  <div style="display: flex; gap: 15px; align-items: center;">
                        <input type="number" id="p-qty" value="1" min="1" max="5"
                              style="width: 60px; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                        <button id="btn-add-cart" onclick="addToCartCurrent()"
                              style="padding: 12px 30px; background: #0f346c; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: bold;">
                              ADD TO CART
                        </button>
                  </div>
            </div>
      </div>

      <!-- Footer -->
      <footer>
            <div class="container" style="text-align: center; margin-top: 50px;">
                  <p>&copy; 2025 UDBHAVA. All rights reserved.</p>
            </div>
      </footer>

      <script src="js/auth.js"></script>
      <script>
            // Logic to extract ID and fetch details
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            let currentProduct = null;

            async function loadProduct() {
                  if (!productId) {
                        document.querySelector('.product-info').innerHTML = "<h2>Product Not Found</h2>";
                        return;
                  }

                  try {
                        const res = await fetch(`/api/products/${productId}`);
                        if (!res.ok) throw new Error('Failed to fetch');
                        currentProduct = await res.json();

                        // Render
                        document.getElementById('p-img').src = currentProduct.images[0] || 'assets/placeholder.jpg';
                        document.getElementById('p-category').textContent = currentProduct.category || 'Collection';
                        document.getElementById('p-name').textContent = currentProduct.name;
                        document.getElementById('p-price').textContent = `₹${currentProduct.price}`;
                        document.getElementById('p-desc').textContent = currentProduct.description || 'No description available.';

                        const stockEl = document.getElementById('p-stock');
                        const btn = document.getElementById('btn-add-cart');

                        if (currentProduct.stockAvailable > 0) {
                              stockEl.textContent = "In Stock";
                              stockEl.style.color = "green";
                              btn.disabled = false;
                        } else {
                              stockEl.textContent = "Out of Stock";
                              stockEl.style.color = "red";
                              btn.disabled = true;
                              btn.style.background = "#ccc";
                              btn.textContent = "SOLD OUT";
                        }

                  } catch (error) {
                        console.error(error);
                        document.querySelector('.product-info').innerHTML = "<h2>Error loading product.</h2>";
                  }
            }

            // Add to Cart Logic (Reused logic from shop.js concept)
            async function addToCartCurrent() {
                  if (!Auth.user) {
                        Auth.openModal('login');
                        return;
                  }

                  const qty = document.getElementById('p-qty').value;

                  try {
                        const res = await fetch('/api/cart/add', {
                              method: 'POST',
                              headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${Auth.token}` // Assuming Auth stores token or cookie handles it
                              },
                              body: JSON.stringify({
                                    productId: currentProduct._id,
                                    quantity: parseInt(qty)
                              })
                        });

                        if (res.ok) {
                              alert('Added to Cart!');
                              window.location.href = 'cart.html'; // Redirect to cart or stay
                        } else {
                              alert('Failed to add to cart');
                        }
                  } catch (err) {
                        console.error(err);
                        alert('Error adding to cart');
                  }
            }

            // Initialize
            loadProduct();
      </script>
</body>

</html>
